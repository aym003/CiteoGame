name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config into index.html
        env:
          API_KEY:              ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN:          ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID:           ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET:       ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID:  ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID:               ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          replacement = (
            "<script>window.FIREBASE_CONFIG = {{"
            " apiKey: \"{API_KEY}\","
            " authDomain: \"{AUTH_DOMAIN}\","
            " projectId: \"{PROJECT_ID}\","
            " storageBucket: \"{STORAGE_BUCKET}\","
            " messagingSenderId: \"{MESSAGING_SENDER_ID}\","
            " appId: \"{APP_ID}\""
            " }};</script>"
          ).format(
            API_KEY=os.environ["API_KEY"],
            AUTH_DOMAIN=os.environ["AUTH_DOMAIN"],
            PROJECT_ID=os.environ["PROJECT_ID"],
            STORAGE_BUCKET=os.environ["STORAGE_BUCKET"],
            MESSAGING_SENDER_ID=os.environ["MESSAGING_SENDER_ID"],
            APP_ID=os.environ["APP_ID"],
          )

          html = open("index.html").read()
          html = re.sub(r'<script>/\* FIREBASE_CONFIG_PLACEHOLDER \*/.*?</script>', replacement, html)
          open("index.html", "w").write(html)
          print("Firebase config injected into index.html")
          PYEOF

      - name: Verify injection
        run: |
          python3 - << 'PYEOF'
          import sys
          html = open("index.html").read()
          if "/* FIREBASE_CONFIG_PLACEHOLDER */" in html:
              print("ERROR: Firebase placeholder was NOT replaced — aborting deploy.")
              sys.exit(1)
          if "apiKey" not in html:
              print("ERROR: apiKey not found in injected HTML — secrets may be empty.")
              sys.exit(1)
          print("Firebase config injection verified OK.")
          PYEOF

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
