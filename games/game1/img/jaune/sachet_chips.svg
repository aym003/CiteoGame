<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90">
  <!-- Shadow -->
  <ellipse cx="35" cy="87" rx="18" ry="3" fill="rgba(0,0,0,0.18)"/>

  <!-- Bag body: classic chips bag shape - narrow top seal, wide middle, narrow bottom seal -->
  <!-- Bottom half -->
  <path d="M21,50 Q12,72 17,82 L53,82 Q58,72 49,50 Z" fill="#CC2200"/>
  <!-- Top half -->
  <path d="M21,50 Q12,28 17,14 L53,14 Q58,28 49,50 Z" fill="#DD3300"/>

  <!-- Metallic foil sheen -->
  <path d="M21,50 Q12,28 17,14 L53,14 Q58,28 49,50 Q12,72 17,82 L53,82 Q58,72 49,50 Z"
        fill="url(#foil)" opacity="0.18"/>
  <defs>
    <linearGradient id="foil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Top crimp seal (horizontal pinch lines) -->
  <rect x="22" y="11" width="26" height="6" rx="2" fill="#AA1800"/>
  <line x1="22" y1="12.5" x2="48" y2="12.5" stroke="#FF6644" stroke-width="0.8"/>
  <line x1="22" y1="14.5" x2="48" y2="14.5" stroke="#FF6644" stroke-width="0.8"/>
  <line x1="22" y1="16.5" x2="48" y2="16.5" stroke="#881100" stroke-width="0.8"/>

  <!-- Bottom crimp seal -->
  <rect x="22" y="79" width="26" height="6" rx="2" fill="#AA1800"/>
  <line x1="22" y1="80.5" x2="48" y2="80.5" stroke="#FF6644" stroke-width="0.8"/>
  <line x1="22" y1="82.5" x2="48" y2="82.5" stroke="#FF6644" stroke-width="0.8"/>
  <line x1="22" y1="84.5" x2="48" y2="84.5" stroke="#881100" stroke-width="0.8"/>

  <!-- Yellow accent band across middle -->
  <path d="M15,44 Q13.5,50 15,56 L55,56 Q56.5,50 55,44 Z" fill="#FFD700" opacity="0.9"/>

  <!-- White brand label area -->
  <rect x="18" y="46" width="34" height="8" rx="1" fill="white" opacity="0.15"/>

  <!-- Chip illustrations (3 wavy oval chips) -->
  <!-- Chip 1 - top left -->
  <ellipse cx="27" cy="35" rx="7" ry="5" fill="#FFD700" stroke="#CC9900" stroke-width="0.7" transform="rotate(-20,27,35)"/>
  <path d="M22,32 Q27,29 32,33" fill="none" stroke="#CC9900" stroke-width="0.8" opacity="0.7"/>

  <!-- Chip 2 - top right -->
  <ellipse cx="43" cy="32" rx="7" ry="5" fill="#FFD700" stroke="#CC9900" stroke-width="0.7" transform="rotate(15,43,32)"/>
  <path d="M38,30 Q43,27 48,31" fill="none" stroke="#CC9900" stroke-width="0.8" opacity="0.7"/>

  <!-- Chip 3 - center, slightly lower -->
  <ellipse cx="35" cy="40" rx="7" ry="5" fill="#FFD700" stroke="#CC9900" stroke-width="0.7" transform="rotate(-5,35,40)"/>
  <path d="M29,39 Q35,36 41,39" fill="none" stroke="#CC9900" stroke-width="0.8" opacity="0.7"/>

  <!-- Chip 4 - bottom area -->
  <ellipse cx="27" cy="67" rx="6" ry="4" fill="#FFD700" stroke="#CC9900" stroke-width="0.7" transform="rotate(10,27,67)"/>
  <ellipse cx="43" cy="70" rx="6" ry="4" fill="#FFD700" stroke="#CC9900" stroke-width="0.7" transform="rotate(-15,43,70)"/>

  <!-- Outline -->
  <path d="M17,14 Q12,28 21,50 Q12,72 17,82 L53,82 Q58,72 49,50 Q58,28 53,14 Z"
        fill="none" stroke="#881100" stroke-width="1.5"/>
</svg>
