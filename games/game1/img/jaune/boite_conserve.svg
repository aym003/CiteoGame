<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72">
  <!-- Can body -->
  <rect x="8" y="12" width="40" height="52" fill="#D8D8D8"/>
  <!-- Top ellipse -->
  <ellipse cx="28" cy="12" rx="20" ry="5.5" fill="#EEEEEE"/>
  <!-- Bottom ellipse -->
  <ellipse cx="28" cy="64" rx="20" ry="5.5" fill="#B8B8B8"/>
  <!-- Label background -->
  <rect x="8" y="20" width="40" height="38" fill="#CC2200"/>
  <!-- Decorative top stripe -->
  <rect x="8" y="20" width="40" height="6" fill="#AA1A00"/>
  <!-- Decorative bottom stripe -->
  <rect x="8" y="52" width="40" height="6" fill="#AA1A00"/>
  <!-- Label text -->
  <text x="28" y="38" text-anchor="middle" fill="white" font-size="7" font-family="Arial Black, Arial" font-weight="bold">TOMATES</text>
  <!-- Decorative tomato circle -->
  <circle cx="28" cy="47" r="7" fill="#FF4422" opacity="0.8"/>
  <circle cx="26" cy="45" r="2" fill="#FF8866" opacity="0.5"/>
  <!-- Highlight -->
  <rect x="10" y="14" width="5" height="48" rx="2" fill="white" opacity="0.2"/>
  <!-- Rim outlines -->
  <ellipse cx="28" cy="12" rx="20" ry="5.5" fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <ellipse cx="28" cy="64" rx="20" ry="5.5" fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <!-- Body outline -->
  <rect x="8" y="12" width="40" height="52" fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
</svg>
