<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100">
  <ellipse cx="30" cy="97" rx="18" ry="3" fill="rgba(0,0,0,0.13)"/>
  <!-- Bottle body - wide / waist / wide PET shape -->
  <path d="M20,28 C13,33 11,38 11,42 C11,49 16,54 17,60 C17,66 11,71 11,75 L11,84 Q11,90 30,90 Q49,90 49,84 L49,75 C49,71 43,66 43,60 C43,54 49,49 49,42 C49,38 47,33 40,28 Z"
        fill="rgba(200,235,255,0.42)"/>
  <!-- Water fill at bottom -->
  <path d="M11,77 L11,84 Q11,90 30,90 Q49,90 49,84 L49,77 Z" fill="rgba(115,195,240,0.48)"/>
  <!-- Ribs above label -->
  <path d="M11,44 Q30,46 49,44" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <path d="M11,48 Q30,50 49,48" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <!-- Label - follows waist curve -->
  <path d="M13,51 C13,55 17,57 17,60 C17,63 13,65 12,70 L48,70 C47,65 43,63 43,60 C43,57 47,55 47,51 Z"
        fill="#1565C0"/>
  <!-- Label white top stripe -->
  <path d="M13,51 L14,55 L46,55 L47,51 Z" fill="white" opacity="0.9"/>
  <!-- Label white bottom stripe -->
  <path d="M12,66 L12,70 L48,70 L48,66 Z" fill="white" opacity="0.9"/>
  <!-- Brand text -->
  <text x="30" y="62" text-anchor="middle" fill="white" font-size="5.5" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="0.3">CRISTAL</text>
  <text x="30" y="67" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="3.8" font-family="Arial, sans-serif">source naturelle</text>
  <!-- Ribs below label -->
  <path d="M11,75 Q30,77 49,75" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <path d="M11,83 Q30,85 49,83" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <!-- Bottle outline -->
  <path d="M20,28 C13,33 11,38 11,42 C11,49 16,54 17,60 C17,66 11,71 11,75 L11,84 Q11,90 30,90 Q49,90 49,84 L49,75 C49,71 43,66 43,60 C43,54 49,49 49,42 C49,38 47,33 40,28 Z"
        fill="none" stroke="#74B6D6" stroke-width="2"/>
  <!-- Neck -->
  <rect x="23" y="15" width="14" height="15" rx="2" fill="rgba(178,222,246,0.58)" stroke="#74B0CE" stroke-width="1.3"/>
  <!-- Cap -->
  <rect x="22" y="5" width="16" height="12" rx="3" fill="#EEEEEE" stroke="#BBBBBB" stroke-width="1.3"/>
  <rect x="24" y="7" width="12" height="5" rx="2" fill="rgba(255,255,255,0.7)"/>
  <!-- Main specular highlight -->
  <path d="M14,33 Q12,53 13,72" stroke="rgba(255,255,255,0.82)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Secondary highlight -->
  <path d="M20,31 Q19,48 20,63" stroke="rgba(255,255,255,0.38)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right edge glint -->
  <path d="M45,40 Q47,55 46,70" stroke="rgba(255,255,255,0.22)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
