<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100">
  <ellipse cx="30" cy="97" rx="18" ry="3" fill="rgba(0,0,0,0.13)"/>
  <!-- Bottle body - crystal clear PET -->
  <path d="M20,28 C13,34 11,46 11,58 L11,82 Q11,90 30,90 Q49,90 49,82 L49,58 C49,46 47,34 40,28 Z" fill="rgba(200,235,255,0.42)"/>
  <!-- Water fill visible through clear body -->
  <path d="M11,74 L11,82 Q11,90 30,90 Q49,90 49,82 L49,74 Z" fill="rgba(115,195,240,0.48)"/>
  <!-- PET ribs above label -->
  <path d="M14,37 Q30,40 46,37" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <path d="M13,45 Q30,48 47,45" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <!-- Label - blue background -->
  <path d="M11.5,50 L11.5,72 Q30,74 48.5,72 L48.5,50 Q30,48 11.5,50 Z" fill="#1565C0"/>
  <!-- Label white stripe top -->
  <path d="M11.5,50 Q30,48 48.5,50 L48.5,54 Q30,52 11.5,54 Z" fill="white" opacity="0.9"/>
  <!-- Label white stripe bottom -->
  <path d="M11.5,68 Q30,66 48.5,68 L48.5,72 Q30,74 11.5,72 Z" fill="white" opacity="0.9"/>
  <!-- Label brand oval -->
  <ellipse cx="30" cy="61" rx="13" ry="6" fill="rgba(255,255,255,0.12)"/>
  <!-- Brand text -->
  <text x="30" y="58" text-anchor="middle" fill="white" font-size="5.5" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="0.3">CRISTAL</text>
  <text x="30" y="65" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="4" font-family="Arial, sans-serif">source naturelle</text>
  <!-- PET ribs below label -->
  <path d="M12,76 Q30,79 48,76" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <path d="M11,84 Q30,87 49,84" stroke="rgba(85,165,210,0.5)" stroke-width="1.3" fill="none"/>
  <!-- Bottle outline -->
  <path d="M20,28 C13,34 11,46 11,58 L11,82 Q11,90 30,90 Q49,90 49,82 L49,58 C49,46 47,34 40,28 Z" fill="none" stroke="#74B6D6" stroke-width="2"/>
  <!-- Neck -->
  <rect x="23" y="15" width="14" height="15" rx="2" fill="rgba(178,222,246,0.58)" stroke="#74B0CE" stroke-width="1.3"/>
  <!-- Cap - clean white -->
  <rect x="22" y="5" width="16" height="12" rx="3" fill="#EEEEEE" stroke="#BBBBBB" stroke-width="1.3"/>
  <rect x="24" y="7" width="12" height="5" rx="2" fill="rgba(255,255,255,0.7)"/>
  <!-- Main specular highlight -->
  <path d="M15,33 Q13,50 13,67" stroke="rgba(255,255,255,0.82)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Secondary highlight -->
  <path d="M21,31 Q20,46 20,60" stroke="rgba(255,255,255,0.38)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right edge glint -->
  <path d="M44,40 Q46,55 46,67" stroke="rgba(255,255,255,0.25)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
