<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 78">
  <!-- Back shadow -->
  <rect x="10" y="22" width="44" height="54" rx="3" fill="#D4500A" opacity="0.3" transform="translate(2,2)"/>
  <!-- Box body -->
  <rect x="10" y="22" width="44" height="54" rx="3" fill="#FF8C00"/>
  <!-- Angled shoulder -->
  <polygon points="10,22 54,22 48,8 16,8" fill="#FFA833"/>
  <!-- Cap base -->
  <rect x="22" y="3" width="14" height="8" rx="3" fill="#CCCCCC"/>
  <!-- Cap -->
  <rect x="24" y="1" width="10" height="5" rx="2" fill="#E0E0E0"/>
  <!-- Label area -->
  <rect x="12" y="34" width="40" height="36" rx="2" fill="#E67000"/>
  <!-- Fruit circle -->
  <circle cx="28" cy="46" r="10" fill="#FFD700" opacity="0.9"/>
  <circle cx="25" cy="43" r="3" fill="#FFF3AA" opacity="0.6"/>
  <!-- JUS text -->
  <text x="28" y="66" text-anchor="middle" fill="white" font-size="8" font-family="Arial Black, Arial" font-weight="bold">JUS</text>
  <!-- Highlight stripe -->
  <rect x="12" y="24" width="5" height="50" rx="2" fill="white" opacity="0.18"/>
  <!-- Crease lines -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="#CC5500" stroke-width="0.8" opacity="0.4"/>
  <!-- Outline -->
  <rect x="10" y="22" width="44" height="54" rx="3" fill="none" stroke="#CC5500" stroke-width="2"/>
  <polygon points="10,22 54,22 48,8 16,8" fill="none" stroke="#CC5500" stroke-width="1.5"/>
</svg>
