<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 96">
  <!-- Shadow -->
  <ellipse cx="20" cy="94" rx="11" ry="2" fill="rgba(0,0,0,0.2)"/>

  <!-- Body (dark green glass) -->
  <rect x="10" y="50" width="20" height="39" rx="3" fill="#246B24"/>
  <!-- Shoulder taper -->
  <path d="M10,50 C10,40 14,30 16,22 L24,22 C26,30 30,40 30,50 Z" fill="#246B24"/>
  <!-- Neck -->
  <rect x="16" y="13" width="8" height="11" rx="1" fill="#246B24"/>

  <!-- Red foil capsule -->
  <rect x="15" y="10" width="10" height="6" rx="2" fill="#B00000"/>
  <line x1="15" y1="13" x2="25" y2="13" stroke="#880000" stroke-width="0.8"/>

  <!-- Cork -->
  <rect x="17.5" y="4" width="5" height="8" rx="2" fill="#C9A066"/>

  <!-- White label -->
  <rect x="11" y="56" width="18" height="26" rx="2" fill="#F8F0E0"/>
  <rect x="12" y="58" width="16" height="8" rx="1" fill="#8B0000"/>
  <line x1="12" y1="70" x2="28" y2="70" stroke="#999" stroke-width="0.8"/>
  <line x1="14" y1="73" x2="26" y2="73" stroke="#999" stroke-width="0.8"/>
  <line x1="14" y1="76" x2="26" y2="76" stroke="#999" stroke-width="0.8"/>

  <!-- Glass highlight -->
  <path d="M13,26 Q12,50 13,80" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

  <!-- Outline -->
  <path d="M16,13 L16,22 C14,30 10,40 10,50 L10,89 Q10,92 20,92 Q30,92 30,89 L30,50 C30,40 26,30 24,22 L24,13"
        fill="none" stroke="#1A4A1A" stroke-width="1.2"/>
  <rect x="16" y="13" width="8" height="11" rx="1" fill="none" stroke="#1A4A1A" stroke-width="1"/>
</svg>
