<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90">
  <!-- Shadow -->
  <ellipse cx="20" cy="88" rx="12" ry="2" fill="rgba(0,0,0,0.2)"/>

  <!-- Bottle body (amber/brown glass) -->
  <rect x="9" y="46" width="22" height="37" rx="4" fill="#8B4500"/>
  <!-- Upper body taper -->
  <path d="M9,46 C9,38 12,30 15,24 L25,24 C28,30 31,38 31,46 Z" fill="#8B4500"/>
  <!-- Neck -->
  <rect x="16" y="14" width="8" height="12" rx="1" fill="#8B4500"/>

  <!-- Crown cap (serrated metal) -->
  <!-- Cap base -->
  <rect x="14" y="10" width="12" height="7" rx="2" fill="#888"/>
  <!-- Crown serrations (zigzag bottom edge) -->
  <polyline points="14,15 15.5,17 17,15 18.5,17 20,15 21.5,17 23,15 24.5,17 26,15" fill="none" stroke="#666" stroke-width="1"/>
  <!-- Cap top face -->
  <ellipse cx="20" cy="10" rx="5.5" ry="2" fill="#999"/>
  <!-- Cap highlight -->
  <ellipse cx="18" cy="9.5" rx="2.5" ry="1" fill="rgba(255,255,255,0.3)"/>

  <!-- Amber glass transparency effect -->
  <rect x="9" y="46" width="22" height="37" rx="4" fill="#FFB347" opacity="0.12"/>

  <!-- Label -->
  <rect x="10" y="52" width="20" height="22" rx="2" fill="#F5E8C0"/>
  <rect x="11" y="54" width="18" height="7" rx="1" fill="#CC6600"/>
  <line x1="11" y1="64" x2="29" y2="64" stroke="#999" stroke-width="0.8"/>
  <line x1="13" y1="67" x2="27" y2="67" stroke="#999" stroke-width="0.8"/>

  <!-- Glass highlight -->
  <path d="M12,28 Q11,48 12,76" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>

  <!-- Outline -->
  <path d="M16,14 L15,24 C12,30 9,38 9,46 L9,83 Q9,86 20,86 Q31,86 31,83 L31,46 C31,38 28,30 25,24 L24,14"
        fill="none" stroke="#5C2D00" stroke-width="1.2"/>
  <rect x="16" y="14" width="8" height="12" rx="1" fill="none" stroke="#5C2D00" stroke-width="1"/>
</svg>
