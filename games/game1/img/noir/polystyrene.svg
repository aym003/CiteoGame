<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 75">
  <ellipse cx="35" cy="73" rx="28" ry="2.5" fill="rgba(0,0,0,0.15)"/>
  <!-- Tray outer (foam white) -->
  <rect x="5" y="10" width="60" height="58" rx="6" fill="#EFEFEF"/>
  <!-- Tray top rim (shows foam depth) -->
  <path d="M11,10 L59,10 Q65,10 65,16 L65,19 Q57,13 35,13 Q13,13 5,19 L5,16 Q5,10 11,10 Z" fill="#DCDCDC"/>
  <!-- Tray inner -->
  <rect x="9" y="14" width="52" height="50" rx="4" fill="#F8F8F8"/>
  <!-- Meat - ground beef -->
  <rect x="11" y="16" width="48" height="46" rx="3" fill="#D04030"/>
  <!-- Meat texture blobs -->
  <ellipse cx="24" cy="26" rx="11" ry="6" fill="#BC3322" opacity="0.6"/>
  <ellipse cx="46" cy="34" rx="12" ry="7" fill="#BC3322" opacity="0.55"/>
  <ellipse cx="30" cy="48" rx="10" ry="6" fill="#BC3322" opacity="0.55"/>
  <!-- Fat marbling highlights -->
  <path d="M18,22 Q30,19 44,24" stroke="rgba(255,205,185,0.55)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M15,38 Q28,35 46,41" stroke="rgba(255,205,185,0.5)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M18,54 Q30,51 50,56" stroke="rgba(255,205,185,0.45)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Plastic film light catch -->
  <polygon points="11,16 36,16 11,41" fill="rgba(255,255,255,0.16)"/>
  <polygon points="59,16 59,37 39,16" fill="rgba(255,255,255,0.1)"/>
  <!-- Tray outline -->
  <rect x="5" y="10" width="60" height="58" rx="6" fill="none" stroke="#C4C4C4" stroke-width="2"/>
  <!-- Price label -->
  <rect x="10" y="55" width="26" height="15" rx="2" fill="#FFFDE0" stroke="#CCCC66" stroke-width="0.9"/>
  <rect x="11" y="56" width="24" height="5" rx="1" fill="#EE3333" opacity="0.8"/>
  <line x1="11" y1="64" x2="35" y2="64" stroke="#BBBB88" stroke-width="0.8"/>
  <line x1="11" y1="67" x2="29" y2="67" stroke="#BBBB88" stroke-width="0.8"/>
</svg>
