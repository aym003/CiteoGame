<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90">
  <!-- Shadow -->
  <ellipse cx="40" cy="87" rx="24" ry="3" fill="rgba(0,0,0,0.18)"/>
  <!-- Jar body (clear glass) -->
  <path d="M12,34 L8,78 C8,84 21,88 40,88 C59,88 72,84 72,78 L68,34 Z" fill="#C8EEC8"/>
  <!-- Jar shoulder/neck area -->
  <rect x="14" y="23" width="52" height="13" rx="2" fill="#B0D8B0"/>
  <!-- Jam content visible inside -->
  <path d="M12,56 L8,78 C8,84 21,88 40,88 C59,88 72,84 72,78 L68,56 Z" fill="#DD3322" opacity="0.6"/>
  <!-- Lid -->
  <rect x="10" y="13" width="60" height="12" rx="4" fill="#CC3030"/>
  <!-- Lid shine -->
  <rect x="14" y="15" width="52" height="5" rx="2" fill="#EE5555" opacity="0.5"/>
  <!-- Label on jar -->
  <rect x="16" y="36" width="48" height="22" rx="3" fill="white" opacity="0.85"/>
  <text x="40" y="47" text-anchor="middle" fill="#8B0000" font-size="6.5" font-family="Arial" font-weight="bold">CONFITURE</text>
  <text x="40" y="55" text-anchor="middle" fill="#CC4444" font-size="5.5" font-family="Arial">🍓 FRAISES</text>
  <!-- Glass highlight -->
  <path d="M14,37 Q11,56 10,74" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Jar outline -->
  <path d="M12,34 L8,78 C8,84 21,88 40,88 C59,88 72,84 72,78 L68,34 Z" fill="none" stroke="#80B880" stroke-width="1.5"/>
</svg>
