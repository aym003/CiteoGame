<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 80">
  <!-- Shadow -->
  <ellipse cx="25" cy="78" rx="14" ry="2.2" fill="rgba(0,0,0,0.18)"/>

  <!-- Bottle body (elegant rectangular, slight taper) -->
  <path d="M10,30 L10,71 Q10,74 25,74 Q40,74 40,71 L40,30 Q40,26 25,26 Q10,26 10,30 Z" fill="#C8A8D0"/>
  <!-- Inner liquid color -->
  <rect x="12" y="32" width="26" height="38" rx="3" fill="#D4B8DC" opacity="0.8"/>

  <!-- Bottle neck -->
  <rect x="19" y="20" width="12" height="12" rx="2" fill="#B898C4"/>

  <!-- Gold cap -->
  <rect x="17" y="11" width="16" height="12" rx="3" fill="#C8A000"/>
  <!-- Cap top -->
  <ellipse cx="25" cy="11" rx="7.5" ry="2.5" fill="#DAB800"/>
  <!-- Cap highlight -->
  <ellipse cx="22" cy="10" rx="3" ry="1.2" fill="rgba(255,255,255,0.4)"/>
  <!-- Cap gold lines -->
  <line x1="17" y1="15" x2="33" y2="15" stroke="#AA8800" stroke-width="0.8"/>
  <line x1="17" y1="18" x2="33" y2="18" stroke="#AA8800" stroke-width="0.8"/>

  <!-- Decorative label area -->
  <rect x="13" y="36" width="24" height="30" rx="2" fill="rgba(255,255,255,0.25)"/>
  <!-- Ornamental border -->
  <rect x="14" y="37" width="22" height="28" rx="1" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
  <!-- Floral / decorative center -->
  <ellipse cx="25" cy="48" rx="5" ry="6" fill="rgba(255,255,255,0.2)"/>
  <line x1="19" y1="58" x2="31" y2="58" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="21" y1="61" x2="29" y2="61" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Glass highlights -->
  <path d="M13,32 Q12,50 13,68" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M37,35 Q38,50 37,65" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>

  <!-- Outline -->
  <path d="M10,30 Q10,26 25,26 Q40,26 40,30 L40,71 Q40,74 25,74 Q10,74 10,71 Z"
        fill="none" stroke="#7A5A8A" stroke-width="1.2"/>
  <rect x="19" y="20" width="12" height="12" rx="2" fill="none" stroke="#7A5A8A" stroke-width="1"/>
</svg>
