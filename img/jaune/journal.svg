<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 58">
  <!-- Shadow page (back) -->
  <rect x="16" y="7" width="54" height="46" rx="2" fill="#DDDDD0"/>
  <!-- Main page -->
  <rect x="8" y="4" width="54" height="46" rx="2" fill="#F5F5EB"/>
  <!-- Header bar -->
  <rect x="8" y="4" width="54" height="11" rx="2" fill="#1A1A1A"/>
  <!-- Header text -->
  <text x="35" y="13" text-anchor="middle" fill="white" font-size="7" font-family="Arial Black, Arial" font-weight="bold">LE JOURNAL</text>
  <!-- Main headline -->
  <rect x="10" y="18" width="50" height="3.5" rx="1" fill="#333333"/>
  <rect x="10" y="24" width="40" height="3" rx="1" fill="#888888"/>
  <!-- Divider -->
  <line x1="10" y1="30" x2="62" y2="30" stroke="#CCCCBB" stroke-width="1"/>
  <!-- Left column text lines -->
  <rect x="10" y="33" width="23" height="2.5" rx="1" fill="#AAAAAA"/>
  <rect x="10" y="37.5" width="23" height="2.5" rx="1" fill="#AAAAAA"/>
  <rect x="10" y="42" width="20" height="2.5" rx="1" fill="#AAAAAA"/>
  <!-- Right column image box -->
  <rect x="36" y="33" width="26" height="14" rx="2" fill="#D0D8E8"/>
  <text x="49" y="43" text-anchor="middle" fill="#8899BB" font-size="9">🖼</text>
  <!-- Bottom text line -->
  <rect x="10" y="46.5" width="50" height="2" rx="1" fill="#CCCCCC"/>
  <!-- Page fold corner -->
  <polygon points="62,4 62,12 54,4" fill="#DDDDCC"/>
  <!-- Outline -->
  <rect x="8" y="4" width="54" height="46" rx="2" fill="none" stroke="#BBBBAA" stroke-width="1.5"/>
</svg>
