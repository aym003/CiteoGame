<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100">
  <ellipse cx="30" cy="97" rx="18" ry="3" fill="rgba(0,0,0,0.13)"/>
  <!-- Bottle body - crystal clear PET -->
  <path d="M20,28 C13,34 11,46 11,58 L11,82 Q11,90 30,90 Q49,90 49,82 L49,58 C49,46 47,34 40,28 Z" fill="rgba(200,235,255,0.42)"/>
  <!-- Water fill visible through clear body -->
  <path d="M11,74 L11,82 Q11,90 30,90 Q49,90 49,82 L49,74 Z" fill="rgba(115,195,240,0.48)"/>
  <!-- PET horizontal ribs -->
  <path d="M13,52 Q30,55 47,52" stroke="rgba(85,165,210,0.5)" stroke-width="1.5" fill="none"/>
  <path d="M12,64 Q30,67 48,64" stroke="rgba(85,165,210,0.5)" stroke-width="1.5" fill="none"/>
  <!-- Bottle outline -->
  <path d="M20,28 C13,34 11,46 11,58 L11,82 Q11,90 30,90 Q49,90 49,82 L49,58 C49,46 47,34 40,28 Z" fill="none" stroke="#74B6D6" stroke-width="2"/>
  <!-- Neck -->
  <rect x="23" y="15" width="14" height="15" rx="2" fill="rgba(178,222,246,0.58)" stroke="#74B0CE" stroke-width="1.3"/>
  <!-- Cap - clean white -->
  <rect x="22" y="5" width="16" height="12" rx="3" fill="#EEEEEE" stroke="#BBBBBB" stroke-width="1.3"/>
  <rect x="24" y="7" width="12" height="5" rx="2" fill="rgba(255,255,255,0.7)"/>
  <!-- Main specular highlight -->
  <path d="M15,33 Q13,50 13,67" stroke="rgba(255,255,255,0.86)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Secondary highlight -->
  <path d="M21,31 Q20,46 20,60" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right edge glint -->
  <path d="M44,40 Q46,55 46,67" stroke="rgba(255,255,255,0.25)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
